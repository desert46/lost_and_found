{% extends "layout.html" %} 
{% block content %}

<h1 class="error_title">{{error_title}}</h1>
<p class="error_message">{{error_message}}</p>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class=flashes style="text-align: center; padding-top: 5px;">
        {% for message in messages %}
            <div>
            {{ message }}
            </div>
        {% endfor %}
        </div>
    {% endif %}
{% endwith %}

{% endblock %}
