{% extends "layout.html" %} 
{% block content %}

<h1 class="title">Upload</h1>

<form method="post" action="/upload">
    <div class="upload_form">
        <h2 class="upload_form_subtitle">Item Type</h2>
        <select name="item_type">
            <option value="BHS Beanie">BHS Beanie</option>
            <option value="BHS Blazer">BHS Blazer</option>
            <option value="BHS Cardigan">BHS Cardigan</option>
            <option value="BHS Jacket">BHS Jacket</option>
            <option value="BHS Lavalava">BHS Lavalava</option>
            <option value="BHS Long-sleeved shirt">BHS Long-sleeved shirt</option>
            <option value="BHS PE Shorts">BHS PE Shorts</option>
            <option value="BHS PE Top">BHS PE Top</option>
            <option value="BHS Scarf">BHS Scarf</option>
            <option value="BHS Short-sleeved shirt">BHS Short-sleeved shirt</option>
            <option value="BHS Shorts">BHS Shorts</option>
            <option value="BHS Skirt">BHS Skirt</option>
            <option value="BHS Sleveless vest">BHS Sleveless vest</option>
            <option value="BHS Socks">BHS Socks</option>
            <option value="BHS Tie">BHS Tie</option>
            <option value="BHS Tights">BHS Tights</option>
            <option value="BHS Tracksuit">BHS Tracksuit</option>
            <option value="BHS Trousers">BHS Trousers</option>
            <option value="BHS V-necked jersey">BHS V-necked jersey</option>
            <option value="Blazer">Blazer</option>
            <option value="Cap">Cap</option>
            <option value="Cardigan">Cardigan</option>
            <option value="Coat">Coat</option>
            <option value="Dress">Dress</option>
            <option value="Hair tie">Hair tie</option>
            <option value="Hat">Hat</option>
            <option value="Hoodie">Hoodie</option>
            <option value="Jacket">Jacket</option>
            <option value="Jandals">Jandals</option>
            <option value="Jeans">Jeans</option>
            <option value="Jersey">Jersey</option>
            <option value="Long skirt">Long skirt</option>
            <option value="Long-sleeved Shirt">Long-sleeved Shirt</option>
            <option value="Pants">Pants</option>
            <option value="Scarf">Scarf</option>
            <option value="Shirt">Shirt</option>
            <option value="Shorts">Shorts</option>
            <option value="skirt">skirt</option>
            <option value="Socks">Socks</option>
            <option value="T-Shirt">T-Shirt</option>
            <option value="Tank top">Tank top</option>
            <option value="Tie">Tie</option>
            <option value="Tights">Tights</option>
        </select>

        <h2 class="upload_form_subtitle">Time found</h2>
        <input type="datetime-local" name="time_found">

        <h2 class="upload_form_subtitle">Size</h2>
        <input type="text" name="size">

        <h2 class="upload_form_subtitle">Nametag</h2>
        <p>Leave empty if none</p>
        <input type="text" name="nametag">

        <h2 class="upload_form_subtitle">Notes</h2>
        <p>Please provide as many extra details as possible (e.g. location found, items in each pocket, significant markings etc.)</p>
        <input type="text" name="notes">

        <input type="submit" value="submit">
    </div>

</form>

{% endblock %}
